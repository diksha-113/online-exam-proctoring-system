<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Students</title>

<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
<!-- Boxicons -->
<link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>

<style>
body { font-family: "Segoe UI", Arial, sans-serif; background: #f5f6fa; }
#sidebar { width: 240px; background: #2f3640; color: #fff; position: fixed; height: 100%; }
#sidebar .brand { font-size: 20px; font-weight: bold; padding: 20px; display: flex; align-items: center; }
#sidebar .brand i { margin-right: 10px; }
#sidebar ul { list-style: none; padding: 0; margin: 0; }
#sidebar ul li a { display: block; color: #fff; padding: 15px 20px; text-decoration: none; transition: 0.3s; }
#sidebar ul li a:hover, #sidebar ul li.active a { background: #404b5a; }
#content { margin-left: 240px; padding: 30px; }
.table th, .table td { vertical-align: middle; }
.table-hover tbody tr:hover { background: #f1f2f6; }
.role-student { color: #007bff; font-weight: 600; }
.role-professor { color: #28a745; font-weight: 600; }
</style>
</head>
<body>

<!-- Sidebar -->
<section id="sidebar">
    <div class="brand"><i class='bx bxs-user-detail'></i> Admin Panel</div>
    <ul class="side-menu top">
        <li class="active"><a href="#"><i class='bx bxs-group'></i> Users</a></li>
        <li><a href="{{ url_for('logout') }}"><i class='bx bxs-log-out-circle'></i> Logout</a></li>
    </ul>
</section>

<!-- Content -->
<section id="content">
    <!-- Top Navbar -->
    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
        <span class="navbar-brand mb-0 h1">Online Exam Proctor</span>
        <div>
            <a href="#">
                <img src="{{ url_for('static', filename='img/school.jpg') }}" 
                     alt="Admin Avatar" 
                     style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
            </a>
        </div>
    </nav>

    <main>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="text-dark font-weight-bold">Registered Users</h4>
        </div>

        <div class="table-responsive shadow-sm rounded bg-white p-3 mt-3">
            {% if students %}
            <table class="table table-hover mb-0">
                <thead class="thead-dark">
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in students %}
                    <tr>
                        <td>{{ user['id'] }}</td>
                        <td>{{ user['username'] }}</td>
                        <td>{{ user['email'] }}</td>
                        <td class="role-{{ user['role'].lower() }}">{{ user['role'] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            {% else %}
            <p class="text-center text-muted py-4">No users found.</p>
            {% endif %}
        </div>
    </main>
</section>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</body>
</html>
