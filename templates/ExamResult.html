<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/display.css') }}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <style>
        .wrapper { display: flex; justify-content: center; margin-top: 50px; }
        .pricing-table { width: 350px; }
        .professional { background: #f5f5f5; padding: 20px; border-radius: 10px; text-align: center; }
        .professional .title { color: #5f9ea0; margin-bottom: 20px; }
        .professional .content img { border-radius: 50%; margin-bottom: 15px; }
        .features { list-style: none; padding: 0; text-align: left; }
        .features li { padding: 5px 0; font-size: 16px; }
        .features span { font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md bg-dark text-white p-3">
        <span class="text-white h5">The Online Exam Proctor</span>
    </nav>

    <div class="wrapper">
        <div class="pricing-table group">
            <div class="professional">
                <h1 class="title">Exam Result</h1>

                {% set result = result_status.split(';') %}

                <div class="content">
                    {% if result[4] %}
                        <img alt="Profile Image" src="{{ url_for('static', filename='Profiles/') }}{{ result[4] }}" style="width:120px; height:120px; object-fit:cover;">
                    {% else %}
                        <img alt="Profile Image" src="{{ url_for('static', filename='Profiles/default.png') }}" style="width:120px; height:120px; object-fit:cover;">
                    {% endif %}
                </div>

                <ul class="features">
                    <li><span>Name:</span> {{ result[0] }}</li>
                    <li><span>Exam Status:</span> {{ result[1] }}</li>
                    <li><span>Total Marks:</span> {{ result[2] }}</li>
                    <li><span>Date:</span> {{ result[3] }}</li>
                </ul>

            </div>
        </div>
    </div>
</body>
</html>
