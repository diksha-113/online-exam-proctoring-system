<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam System Check</title>

<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
<link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>

<style>
body { font-family: "Segoe UI", Arial, sans-serif; background: #f0f2f5; color: #333; }
.navbar { background-color: #1e3799; color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 1rem 2rem; margin-bottom: 2rem; border-radius: 6px; text-align: center; }
.navbar span { color: #fff; font-weight: 600; font-size: 1.2rem; }
h1 { font-weight: 600; margin-bottom: 2rem; color: #1e3799; text-align: center; }
.table-container {
    background: #fff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    max-width: 600px;
    margin: 40px auto;
    text-align: center;
}
.table th, .table td { vertical-align: middle; }
.status-dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 8px;
    background-color: #f87171; /* Red default */
}
.status-available { background-color: #44bd32; } /* Green if available */
.nextButton { text-align: center; margin-top: 25px; }
.nextButton a {
    display: inline-block;
    padding: 0.6rem 1.5rem;
    background-color: #1e3799;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
    transition: 0.3s;
}
.nextButton a:hover { background-color: #162c80; }
footer { text-align: center; padding: 1rem; background-color: #1e3799; color: #fff; margin-top: 30px; font-size: 0.9rem; border-radius: 6px; }
</style>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

<nav class="navbar">
    <span>Online Exam Proctor</span>
</nav>

<main>
<div class="table-container">
    <h1>System Compatibility Check</h1>
    <table class="table table-hover mb-0">
        <thead class="thead-light">
            <tr>
                <th>Device</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Webcam</td>
                <td>
                    <span class="status-dot" id="webcam-dot"></span>
                    <span id="webcam-status">Checking...</span>
                </td>
            </tr>
            <tr>
                <td>Microphone</td>
                <td>
                    <span class="status-dot" id="microphone-dot"></span>
                    <span id="microphone-status">Checking...</span>
                </td>
            </tr>
        </tbody>
    </table>
    <div class="text-center mt-4">
    <p>System check failed. Please ensure your webcam and microphone are available.</p>
    <a href="{{ url_for('systemCheck', exam_id=exam['exam_id']) }}" class="btn btn-warning">Retry System Check</a>
    <a href="{{ url_for('studentsDashboard') }}" class="btn btn-secondary">Go to Dashboard</a>
</div>


    <div class="nextButton">
       <a href="{{ url_for('takeExam', exam_id=exam['exam_id']) }}" class="btn btn-primary">Next »</a>
    </div>
</div>
</main>

<footer>
    &copy; 2025 The Online Exam Proctor System
</footer>

<script>
async function checkWebcamAndMicrophone() {
    const webcamStatusElement = document.getElementById('webcam-status');
    const webcamDot = document.getElementById('webcam-dot');
    const microphoneStatusElement = document.getElementById('microphone-status');
    const microphoneDot = document.getElementById('microphone-dot');

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });

        webcamStatusElement.textContent = 'Available';
        webcamDot.classList.add('status-available');

        microphoneStatusElement.textContent = 'Available';
        microphoneDot.classList.add('status-available');

        stream.getTracks().forEach(track => track.stop());
    } catch (error) {
        webcamStatusElement.textContent = 'Not available';
        microphoneStatusElement.textContent = 'Not available';
    }
}

checkWebcamAndMicrophone();

$(document).ready(function() {
    $("#ajax-link").click(function(event) {
        event.preventDefault();

        const checkValue1 = document.getElementById('webcam-status').textContent;
        const checkValue2 = document.getElementById('microphone-status').textContent;

        $$.ajax({
    url: "/systemCheck/{{ exam_id }}",  // include exam_id dynamically
    type: "POST",
    contentType: "application/json",
    data: JSON.stringify({ input: checkValue1 + ';' + checkValue2 }),
    success: function(response) {
        window.location.href = response['output'];  // redirect to next page
    },
    error: function(xhr, status, error) {
        console.error("AJAX request failed:", error);
    }
});

    });
});
</script>

</body>
</html>
