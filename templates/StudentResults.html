<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Results</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
<link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
<style>
body { font-family: "Segoe UI", Arial, sans-serif; background: #f5f6fa; }
#sidebar { width: 240px; background: #2f3640; color: #fff; position: fixed; height: 100%; }
#sidebar .brand { font-size: 20px; font-weight: bold; padding: 20px; display: flex; align-items: center; }
#sidebar .brand i { margin-right: 10px; }
#sidebar ul { list-style: none; padding: 0; margin: 0; }
#sidebar ul li a { display: block; color: #fff; padding: 15px 20px; text-decoration: none; transition: 0.3s; }
#sidebar ul li a:hover, #sidebar ul li.active a { background: #404b5a; }
#content { margin-left: 240px; padding: 30px; }
.table th, .table td { vertical-align: middle; }
.table-hover tbody tr:hover { background: #f1f2f6; }
.btn-hover:hover { transform: translateY(-2px); transition: 0.3s; }
</style>
</head>
<body>

<!-- Sidebar -->
<section id="sidebar">
    <div class="brand"><i class='bx bxs-graduation'></i> Student Dashboard</div>
    <ul class="side-menu top">
        <li><a href="{{ url_for('students') }}"><i class='bx bxs-book'></i> Exams</a></li>
        <li class="active"><a href="{{ url_for('studentResults') }}"><i class='bx bxs-bar-chart-alt-2'></i> View Results</a></li>
        <li><a href="{{ url_for('logout') }}"><i class='bx bxs-log-out-circle'></i> Logout</a></li>
    </ul>
</section>

<!-- Content -->
<section id="content">
<nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <span class="navbar-brand mb-0 h1">Online Exam Proctor</span>
</nav>

<main>
    <div class="table-responsive shadow-sm rounded bg-white p-3">
       <div class="table-responsive shadow-sm rounded bg-white p-3">
  <table class="table table-hover table-striped">
    <thead>
      <tr>
        <th>Exam Name</th>
        <th>Score</th>
        <th>Status</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody>
      {% for r in results %}
        <tr>
          <td>{{ r.exam_name }}</td>
          <td>{{ r.score }}%</td>
          <td>{{ r.status }}</td>
          <td>{{ r.created_at.strftime('%d-%m-%Y %H:%M') if r.created_at else '' }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

    </div>
</main>

</section>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</body>
</html>
